name: Build MagiskSSH

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make \
            wget \
            python3 \
            p7zip-full \
            perl \
            autoconf \
            patch \
            zip

      - name: Setup Android NDK r29
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29

      - name: Build module
        env:
          ANDROID_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          mkdir build
          cd build
          make -f ../all_arches.mk -j$(nproc) zip

      - name: Upload module
        uses: actions/upload-artifact@v4
        with:
          name: MagiskSSH
          path: build/*.zip
